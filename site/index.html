<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sitemap Monitor</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./intelligence.css"></head><body>
<section id="auth" class="card auth"><h1>Sitemap Monitor</h1><p>输入邮箱，我们会发送免密码登录链接</p><form id="login"><input id="email" type="email" autocomplete="email" placeholder="邮箱" required><button id="magicLink">发送登录链接</button></form><p id="msg"></p></section>
<main id="app" hidden><header><div><h1>Sitemap Monitor</h1><p>网站地图与 robots.txt 监控</p></div><div><button id="refresh" class="secondary">刷新</button><button id="logout" class="secondary">退出</button></div></header>
<section class="stats"><article>网站<strong id="nSites">0</strong></article><article>分组<strong id="nGroups">0</strong></article><article>24h 新增<strong id="nAdded">0</strong></article><article>异常<strong id="nErrors">0</strong></article></section>
<section class="grid"><article class="card"><div class="title"><h2>网站分组</h2><button id="newGroup">+ 新建</button></div><div id="groups"></div></article><article class="card"><div class="title"><h2>监控网站</h2><button id="newSite">+ 添加</button></div><div id="sites"></div></article></section>
<section class="grid intelligence"><article class="card"><div class="title"><h2>近期内容关键词</h2><span class="meta">按新页面出现频次</span></div><div id="keywords"></div></article><article class="card"><div class="title"><h2>竞品新页面分析</h2><span class="meta">每次最多分析 25 页</span></div><div id="insights"></div></article></section>
<section class="card"><h2>最近扫描</h2><div id="history"></div></section></main>
<dialog id="groupDlg"><form id="groupForm"><h2>分组</h2><input id="groupName" required placeholder="例如：加密货币"><div class="actions"><button type="button" data-close="groupDlg" class="secondary">取消</button><button>保存</button></div></form></dialog>
<dialog id="siteDlg"><form id="siteForm"><h2>网站</h2><label>名称<input id="siteName" required></label><label>首页 URL<input id="homeUrl" type="url" required placeholder="https://example.com"></label><label>分组<select id="siteGroup"></select></label><label>Sitemap URL（留空则自动发现）<input id="sitemapUrl" type="url"></label><div class="actions"><button type="button" data-close="siteDlg" class="secondary">取消</button><button>保存</button></div></form></dialog>
<div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./app.js"></script></body></html>
