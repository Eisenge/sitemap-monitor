name: Deploy dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-branch
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish site to gh-pages branch
        run: |
          set -eu
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY"
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cp -R repo/site public
          printf 'window.APP_CONFIG = { SUPABASE_URL: "%s", SUPABASE_ANON_KEY: "%s" };\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > public/config.js
          touch public/.nojekyll
          cd public
          git init -b gh-pages
          git config user.name github-actions
          git config user.email actions@github.com
          git add .
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
